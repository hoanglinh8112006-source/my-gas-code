<script>
/* =====================  CÁC TRANG CỦA NHÀ KHOA HỌC  ===================== */
function head(title, desc, right) { return '<div class="page-head"><div><h1>' + esc(title) + '</h1>' + (desc ? '<p>' + desc + '</p>' : '') + '</div><div>' + (right || '') + '</div></div>'; }
function warnBox(sec) {
  var w = CV.validate(S.profile).filter(function (x) { return x.sec === sec; });
  return w.length ? '<div class="alert warn"><b>Gợi ý kiểm tra (không bắt buộc sửa):</b><ul style="margin:4px 0 0 18px;padding:0">' + w.map(function (x) { return '<li>' + esc(x.msg) + '</li>'; }).join('') + '</ul></div>' : '';
}
function actionBtns(act, id) { return '<button class="btn sm" data-act="' + act + '_edit" data-id="' + id + '">Sửa</button> <button class="btn sm danger" data-act="' + act + '_del" data-id="' + id + '">Xoá</button>'; }
function findById(arr, id) { return arr.filter(function (x) { return x.id === id; })[0]; }
function upsert(arrKey, rec) {
  var arr = S.profile[arrKey], i = arr.map(function (x) { return x.id; }).indexOf(rec.id);
  if (i >= 0) arr[i] = rec; else arr.push(rec);
  markDirty(); render();
}
function delItem(arrKey, id, what) {
  confirmBox('Xoá ' + what, 'Bạn có chắc muốn xoá mục này? Thao tác chỉ có hiệu lực sau khi bạn bấm Lưu.', 'Xoá').then(function (ok) {
    if (!ok) return; S.profile[arrKey] = S.profile[arrKey].filter(function (x) { return x.id !== id; }); markDirty(); render();
  });
}

/* ---------------------------------------------------------------- Thông tin cơ bản */
PAGES.basic = function (root) {
  var P = S.profile, B = P.basic, D = CV.derive(P), E = CV.effective(P);
  var ver = B.contactEmail ? (B.contactEmailVerified ? '<span class="tag ok">Đã xác minh</span>' : '<button class="btn sm" data-act="verify_email">Xác minh email này</button>') : '';
  var idl = P.idDoc.type === 'CMND' ? 'Số CMND' : P.idDoc.type === 'CCCD' ? 'Số CCCD' : 'Số thẻ căn cước';
  root.innerHTML = head('Thông tin cơ bản', 'Mục I của mẫu lý lịch khoa học, bố cục theo từng dòng như mẫu. Dấu <span style="color:var(--bad)">*</span> là bắt buộc.') +
    '<div class="card"><h2 class="sec">I. Lý lịch sơ lược</h2>' +
    irow(fld('Họ và tên', 'basic.fullName', { req: 1, inl: 1, w: '62%' }), fld('Giới tính', 'basic.gender', { t: 'select', opts: ['Nữ', 'Nam'], inl: 1, w: '28%', cls: 'sm' })) +
    irow(fld('Ngày, tháng, năm sinh', 'basic.dob', { v: 'date', ph: 'dd/mm/yyyy', inl: 1, w: '48%' }), fld('Nơi sinh', 'basic.pob', { list: 'geo', seg: 1, inl: 1, w: '46%', ph: 'Phường/xã, tỉnh/thành phố' })) +
    irow(fld('Quê quán', 'basic.hometown', { list: 'geo', seg: 1, inl: 1, w: '62%', ph: 'Phường/xã, tỉnh/thành phố' }), fld('Dân tộc', 'basic.ethnicity', { list: 'ethnicities', inl: 1, w: '28%', cls: 'sm' })) +
    irow(fld('Học vị cao nhất', 'basic.hvDegree', { val: E.degree, list: 'degrees', inl: 1, w: '36%' }), fld('Năm nhận học vị', 'basic.hvYear', { val: E.year, v: 'year', list: 'years', inl: 1, w: '24%', cls: 'sm' }), fld('Nước nhận học vị', 'basic.hvCountry', { val: E.country, list: 'countries', inl: 1, w: '30%' })) +
    irow(fld('Chức danh khoa học cao nhất', 'basic.hvTitle', { val: E.title, list: 'titles', inl: 1, w: '62%' }), fld('Năm bổ nhiệm', 'basic.hvTitleYear', { val: E.titleYear, v: 'year', list: 'years', inl: 1, w: '28%', cls: 'sm' })) +
    '<p class="muted small" style="margin:-4px 0 12px">Học vị, năm, nước và chức danh được tự điền từ mục <a href="#" class="btn link" data-act="go" data-id="training">Quá trình đào tạo</a>; bạn có thể sửa trực tiếp, xoá trống để quay lại giá trị tự suy ra.</p>' +
    irow(fld('Chức vụ (hiện tại hoặc trước khi nghỉ hưu)', 'basic.position', { inl: 1, w: '100%' })) +
    irow(fld('Đơn vị công tác (hiện tại hoặc trước khi nghỉ hưu)', 'basic.workplace', { inl: 1, w: '100%' })) +
    irow(fld('Chỗ ở riêng hoặc địa chỉ liên lạc', 'basic.address', { list: 'geo', seg: 1, inl: 1, w: '100%', hint: 'Gõ số nhà, đường; sau dấu phẩy gõ tên phường/xã để chọn gợi ý (kèm tỉnh/thành phố). Bạn có thể sửa tự do.' })) +
    '<div class="irow"><div class="f lab-only"><label style="padding-top:9px">Điện thoại liên hệ:</label></div>' + fld('CQ', 'basic.phoneCQ', { inl: 1, w: '24%', cls: 'sm' }) + fld('NR', 'basic.phoneNR', { inl: 1, w: '24%', cls: 'sm' }) + fld('ĐĐ', 'basic.phoneDD', { inl: 1, w: '24%', cls: 'sm' }) + '</div>' +
    irow(fld('Fax', 'basic.fax', { inl: 1, w: '36%' }), fld('E-mail', 'basic.contactEmail', { v: 'email', ph: S.user.email, inl: 1, w: '54%', hint: 'Để trống = dùng email đăng nhập (' + esc(S.user.email) + '). Email khác cần xác minh. ' + ver })) +
    irow('<div class="f sm" style="--w:150px"><label>Loại</label><div class="fw"><select id="f_idDoc_type" data-bind="idDoc.type">' + [['CMND', 'CMND (cũ)'], ['CCCD', 'CCCD'], ['The can cuoc', 'Thẻ căn cước']].map(function (o) { return '<option value="' + o[0] + '"' + (P.idDoc.type === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div></div>',
      fld(idl, 'idDoc.number', { inl: 1, w: '32%', hint: 'Mã hoá khi lưu, không hiển thị cho quản trị.' }), fld('Ngày cấp', 'idDoc.issueDate', { v: 'date', ph: 'dd/mm/yyyy', inl: 1, w: '26%', cls: 'sm' })) +
    irow(fld('Nơi cấp', 'idDoc.issuePlace', { list: 'idplace', inl: 1, w: '100%', hint: P.idDoc.type === 'CCCD' ? 'Gợi ý mặc định cho CCCD: Cục Cảnh sát quản lý hành chính về trật tự xã hội (có thể sửa).' : 'CMND cũ do công an tỉnh/thành cấp: hãy nhập nơi cấp.' })) + '</div>';
};
PAGES._onBind = function (p, v) {
  var Dv = CV.derive(S.profile), HV = { 'basic.hvDegree': Dv.highestDegree, 'basic.hvYear': Dv.highestDegreeYear, 'basic.hvCountry': Dv.highestDegreeCountry, 'basic.hvTitle': Dv.highestTitle, 'basic.hvTitleYear': Dv.titleYear };
  if (HV[p] !== undefined && String(v).trim() === HV[p]) setPath(S.profile, p, '');
  if (p === 'idDoc.type') {
    if (v === 'CCCD' && !S.profile.idDoc.issuePlace) S.profile.idDoc.issuePlace = CV.CCCD_PLACE;
    if (v !== 'CCCD' && S.profile.idDoc.issuePlace === CV.CCCD_PLACE) S.profile.idDoc.issuePlace = '';
    render();
  }
  if (p === 'basic.contactEmail') S.profile.basic.contactEmailVerified = false;
};
ACT.verify_email = function () {
  var email = S.profile.basic.contactEmail;
  if (VAL.email(email)) return toast('Email không hợp lệ.', true);
  (S.firstRun || S.dirty ? saveProfile() : Promise.resolve(true)).then(function (ok) {
    if (!ok) return;
    rpc('apiSendEmailVerification', email).then(function () {
      var m = openModal('<header><h2>Nhập mã xác minh</h2></header><div class="body"><p>Đã gửi mã 6 chữ số tới <b>' + esc(email) + '</b>. Mã có hiệu lực 48 giờ.</p><div class="f"><label for="vc">Mã xác minh</label><input id="vc" type="text" maxlength="6" inputmode="numeric"><div class="err"></div></div></div><footer><button class="btn" data-close>Đóng</button><button class="btn primary" id="vcOk">Xác nhận</button></footer>', { onEnter: go });
      function go() { rpc('apiConfirmEmailCode', $('#vc', m.root).value).then(function (r) { S.profile.basic.contactEmail = r.contactEmail; S.profile.basic.contactEmailVerified = true; S.updatedAt = r.updatedAt; m.close(); render(); toast('Đã xác minh email.'); }).catch(function (e) { $('.err', m.root).textContent = e.message; }); }
      $('#vcOk', m.root).onclick = go; $('#vc', m.root).focus();
    }).catch(function (e) { toast(e.message, true); });
  });
};

/* ---------------------------------------------------------------- Thông tin bổ sung */
PAGES.extra = function (root) {
  var X = S.profile.extra, A = X.aspirations;
  var asp = [['giangDay', 'Thỉnh giảng'], ['hoiDong', 'Tham gia hội đồng khoa học'], ['nghienCuu', 'Tìm đồng đội nghiên cứu'], ['huongDan', 'Hướng dẫn luận văn/luận án'], ['tuVan', 'Tư vấn doanh nghiệp và chuyển giao công nghệ']];
  root.innerHTML = head('Thông tin bổ sung', 'Phục vụ kết nối nguồn lực. Quản trị <b>chỉ thấy</b> các mục này nếu bạn đồng ý ở “Quyền riêng tư”.') +
    '<div class="card"><h2>Nguyện vọng</h2>' + asp.map(function (a) { return fld(a[1], 'extra.aspirations.' + a[0], { t: 'check' }); }).join('') + '</div>' +
    '<div class="card"><div class="page-head" style="margin-bottom:8px"><h2 style="margin:0">Môn có thể giảng dạy</h2><button class="btn sm" data-act="course_add">+ Thêm môn</button></div>' +
    (X.courses.length ? '<div class="tscroll"><table class="t"><tr><th>Ngành/chuyên ngành</th><th>Tên môn</th><th>Mô tả</th><th></th></tr>' + X.courses.map(function (c) { return '<tr><td>' + esc(c.major) + '</td><td>' + esc(c.name) + '</td><td>' + esc(c.desc) + '</td><td class="right" style="white-space:nowrap">' + actionBtns('course', c.id) + '</td></tr>'; }).join('') + '</table></div>' : '<div class="empty">Chưa có môn giảng dạy nào.</div>') + '</div>' +
    '<div class="card"><div class="page-head" style="margin-bottom:8px"><h2 style="margin:0">Hướng nghiên cứu chuyên sâu</h2><button class="btn sm" data-act="dir_add">+ Thêm hướng</button></div>' +
    (X.directions.length ? '<div class="tscroll"><table class="t"><tr><th>Hướng nghiên cứu</th><th>Từ khoá</th><th></th></tr>' + X.directions.map(function (c) { return '<tr><td>' + esc(c.name) + '</td><td>' + esc(c.keywords) + '</td><td class="right" style="white-space:nowrap">' + actionBtns('dir', c.id) + '</td></tr>'; }).join('') + '</table></div>' : '<div class="empty">Chưa có hướng nghiên cứu nào. Nên nhập kèm từ khoá để việc ghép nối chính xác hơn.</div>') + '</div>' +
    '<div class="card"><h2>Liên kết định danh học thuật</h2><div class="grid c3">' + fld('ORCID', 'extra.orcid', { ph: '0000-0000-0000-0000' }) + fld('Scopus Author ID', 'extra.scopusId') + fld('Google Scholar (URL)', 'extra.scholar') + '</div></div>';
};
/* extra.* là mảng lồng: dùng helper riêng */
function upsertX(key, rec) { var arr = S.profile.extra[key], i = arr.map(function (x) { return x.id; }).indexOf(rec.id); if (i >= 0) arr[i] = rec; else arr.push(rec); markDirty(); render(); }
ACT.course_add = function () { openForm({ title: 'Thêm môn giảng dạy', rec: { id: uid() }, fields: [{ k: 'major', label: 'Ngành/chuyên ngành', list: 'majors', req: 1 }, { k: 'name', label: 'Tên môn', req: 1 }, { k: 'desc', label: 'Mô tả ngắn', t: 'area', rows: 2 }], onSave: function (r) { upsertX('courses', r); } }); };
ACT.course_edit = function (id) { openForm({ title: 'Sửa môn giảng dạy', rec: findById(S.profile.extra.courses, id), fields: [{ k: 'major', label: 'Ngành/chuyên ngành', list: 'majors', req: 1 }, { k: 'name', label: 'Tên môn', req: 1 }, { k: 'desc', label: 'Mô tả ngắn', t: 'area', rows: 2 }], onSave: function (r) { upsertX('courses', r); } }); };
ACT.course_del = function (id) { confirmBox('Xoá môn', 'Xoá môn giảng dạy này?', 'Xoá').then(function (ok) { if (ok) { S.profile.extra.courses = S.profile.extra.courses.filter(function (x) { return x.id !== id; }); markDirty(); render(); } }); };
var DIR_FIELDS = [{ k: 'name', label: 'Hướng nghiên cứu', req: 1 }, { k: 'keywords', label: 'Từ khoá', hint: 'Phân tách bằng dấu phẩy, ví dụ: học sâu, thị giác máy tính', t: 'area', rows: 2 }];
ACT.dir_add = function () { openForm({ title: 'Thêm hướng nghiên cứu', rec: { id: uid() }, fields: DIR_FIELDS, onSave: function (r) { upsertX('directions', r); } }); };
ACT.dir_edit = function (id) { openForm({ title: 'Sửa hướng nghiên cứu', rec: findById(S.profile.extra.directions, id), fields: DIR_FIELDS, onSave: function (r) { upsertX('directions', r); } }); };
ACT.dir_del = function (id) { confirmBox('Xoá hướng nghiên cứu', 'Xoá hướng nghiên cứu này?', 'Xoá').then(function (ok) { if (ok) { S.profile.extra.directions = S.profile.extra.directions.filter(function (x) { return x.id !== id; }); markDirty(); render(); } }); };

/* ---------------------------------------------------------------- Quá trình đào tạo */
var DEG_BY_LEVEL = { 'Đại học': ['Cử nhân', 'Kỹ sư'], 'Sau đại học': ['Thạc sĩ', 'Tiến sĩ', 'Tiến sĩ (DBA)'] };
var LANG_LEVELS = ['Thành thạo', 'Tốt', 'Khá', 'Trung bình', 'Cơ bản'];
PAGES.training = function (root) {
  var P = S.profile, tab = S.trainTab;
  var add = '<div class="menu"><button class="btn primary" data-act="menu">+ Thêm ▾</button><div class="menu-pop" hidden><button data-act="deg_add">Thêm học vị</button><button data-act="title_add">Thêm học hàm</button><button data-act="lang_add">Thêm ngoại ngữ</button></div></div>';
  var body = '';
  if (tab === 'deg') {
    body += warnBox('degrees');
    body += '<h2>Học vị</h2>' + (P.degrees.length ? '<div class="tscroll"><table class="t"><tr><th>Bậc / Học vị</th><th>Ngành</th><th>Nơi đào tạo</th><th>Năm</th><th></th></tr>' +
      P.degrees.slice().sort(function (a, b) { return CV.num(a.year) - CV.num(b.year); }).map(function (d) { return '<tr><td>' + esc(d.level) + '<br><b>' + esc(d.degree) + '</b>' + (d.second ? ' <span class="tag">Bằng 2</span>' : '') + '</td><td>' + esc(d.major) + '</td><td>' + esc(d.institution) + (d.country ? '<br><span class="muted small">' + esc(d.country) + '</span>' : '') + '</td><td>' + esc(d.year) + '</td><td class="right" style="white-space:nowrap">' + actionBtns('deg', d.id) + '</td></tr>'; }).join('') + '</table></div>' : '<div class="empty">Chưa có học vị nào. Thêm học vị.</div>');
    body += '<h2 style="margin-top:20px">Học hàm</h2>' + (P.titles.length ? '<div class="tscroll"><table class="t"><tr><th>Chức danh</th><th>Ngành/chuyên ngành</th><th>Năm phong/bổ nhiệm</th><th></th></tr>' + P.titles.map(function (t) { return '<tr><td><b>' + esc(t.title) + '</b></td><td>' + esc(t.major) + '</td><td>' + esc(t.year) + '</td><td class="right" style="white-space:nowrap">' + actionBtns('title', t.id) + '</td></tr>'; }).join('') + '</table></div>' : '<div class="empty">Chưa có học hàm nào. Bỏ qua nếu bạn chưa được phong/bổ nhiệm.</div>');
  } else {
    body += '<p class="muted">Kéo thả (hoặc dùng mũi tên) để sắp thứ tự ưu tiên. Mẫu có 3 dòng ngoại ngữ nên file Word tự động thêm dòng khi bạn có nhiều hơn 3.</p>' +
      (P.languages.length ? '<div class="tscroll"><table class="t" id="langTable"><tr><th style="width:30px"></th><th>Ngôn ngữ</th><th>Mức độ sử dụng</th><th>Chứng chỉ</th><th></th></tr>' + P.languages.map(function (l, i) { return '<tr draggable="true" data-id="' + l.id + '"><td class="muted" style="cursor:grab">⋮⋮</td><td>' + (i + 1) + '. ' + esc(l.language) + '</td><td>' + esc(l.level) + '</td><td>' + esc(l.certificate) + '</td><td class="right" style="white-space:nowrap"><button class="btn sm" data-act="lang_up" data-id="' + l.id + '">↑</button> <button class="btn sm" data-act="lang_down" data-id="' + l.id + '">↓</button> ' + actionBtns('lang', l.id) + '</td></tr>'; }).join('') + '</table></div>' : '<div class="empty">Chưa có ngoại ngữ nào. Thêm ngoại ngữ.</div>');
  }
  root.innerHTML = head('Quá trình đào tạo', 'Mục II của mẫu. Học vị cao nhất và chức danh cao nhất ở trang “Thông tin cơ bản” được tự suy ra từ đây.', add) +
    '<div class="card"><div class="tabs"><button class="' + (tab === 'deg' ? 'on' : '') + '" data-act="ttab" data-id="deg">Học vị – Học hàm</button><button class="' + (tab === 'lang' ? 'on' : '') + '" data-act="ttab" data-id="lang">Ngoại ngữ</button></div>' + body + '</div>';
  var tb = $('#langTable');
  if (tb) {
    var dragId = null;
    $$('tr[draggable]', tb).forEach(function (tr) {
      tr.addEventListener('dragstart', function () { dragId = tr.dataset.id; });
      tr.addEventListener('dragover', function (e) { e.preventDefault(); });
      tr.addEventListener('drop', function (e) { e.preventDefault(); if (!dragId || dragId === tr.dataset.id) return; var a = S.profile.languages, from = a.map(function (x) { return x.id; }).indexOf(dragId), to = a.map(function (x) { return x.id; }).indexOf(tr.dataset.id); a.splice(to, 0, a.splice(from, 1)[0]); markDirty(); render(); });
    });
  }
};
ACT.ttab = function (t) { S.trainTab = t; render(); };
function degFields(rec) {
  return [
    { k: 'level', label: 'Bậc học', t: 'select', opts: ['Đại học', 'Sau đại học'], req: 1 },
    { k: 'degree', label: 'Học vị', t: 'select', opts: [], req: 1 },
    { k: 'major', label: 'Ngành/chuyên ngành', list: 'majors', req: 1 },
    { k: 'institution', label: 'Nơi đào tạo', list: 'schools', req: 1 },
    { k: 'country', label: 'Nước đào tạo', list: 'countries', req: 1 },
    { k: 'year', label: 'Năm tốt nghiệp/cấp bằng', v: 'year', req: 1, ph: 'yyyy' },
    { k: 'system', label: 'Hệ đào tạo', list: 'systems', show: function (r) { return r.level === 'Đại học'; }, hint: 'Chính quy, vừa làm vừa học, từ xa…' },
    { k: 'second', label: 'Đây là bằng đại học thứ hai', t: 'check', show: function (r) { return r.level === 'Đại học'; } },
    { k: 'thesis', label: 'Tên luận văn/luận án', t: 'area', rows: 2, show: function (r) { return r.level === 'Sau đại học' && (r.degree === 'Thạc sĩ' || String(r.degree).indexOf('Tiến sĩ') === 0); }, hint: 'Mẫu BM04 chỉ in tên luận án (Tiến sĩ).' }
  ];
}
function fixDegOpts(root, rec) {
  var sel = $('#mf_degree', root); if (!sel) return; var opts = DEG_BY_LEVEL[rec.level] || [];
  sel.innerHTML = '<option value=""></option>' + opts.map(function (o) { return '<option' + (o === rec.degree ? ' selected' : '') + '>' + o + '</option>'; }).join('');
  if (opts.indexOf(rec.degree) < 0) { rec.degree = ''; }
}
function openDegForm(rec) {
  var isNew = !rec;
  var m = openForm({ title: isNew ? 'Thêm học vị' : 'Sửa học vị', rec: rec || { id: uid(), level: 'Đại học' }, fields: degFields(), wide: false,
    onChange: function (r, root) { if (root._lv !== r.level) { root._lv = r.level; fixDegOpts(root, r); } },
    onSave: function (r) {
      var dup = S.profile.degrees.some(function (d) { return d.id !== r.id && d.degree === r.degree && CV.norm(d.major) === CV.norm(r.major) && d.year === r.year; });
      if (dup) toast('Lưu ý: có thể bạn đã nhập học vị này.');
      upsert('degrees', r);
    } });
  m.root._lv = (rec || { level: 'Đại học' }).level; fixDegOpts(m.root, rec || { level: 'Đại học', degree: '' });
  if (rec) $('#mf_degree', m.root).value = rec.degree;
}
ACT.deg_add = function () { S.trainTab = 'deg'; openDegForm(); };

function guessMe(authors) {
  var me = CV.norm(S.profile.basic.fullName); if (!me) return authors;
  var parts = me.split(' '), rev = parts.length > 1 ? parts.slice(1).concat(parts[0]).join(' ') : me, found = false;
  authors.forEach(function (a) { a.me = false; var n = CV.norm(a.name); if (!found && (n === me || n === rev)) { a.me = true; found = true; } });
  if (!found && authors.length === 0) authors.push({ name: S.profile.basic.fullName, me: true, main: false, corr: false });
  return authors;
}
function openPubForm(rec, isNew) {
  rec = rec || { id: uid(), type: 'article', authors: [{ name: S.profile.basic.fullName || '', me: true, main: false, corr: false }], source: 'manual' };
  openForm({ title: isNew === false ? 'Sửa công bố' : (rec.source && rec.source !== 'manual' ? 'Xác nhận thông tin công bố' : 'Thêm công bố'), rec: rec, fields: PUB_FIELDS, wide: true,
    onSave: function (r, orig) {
      r.verified = !!(orig.verified && orig.doi && orig.doi === r.doi); if (!r.verified && r.source !== 'manual') r.source = 'manual';
      if (rec.source && rec.source !== 'manual' && isNew !== false) r.verified = true;
      if (!(r.authors || []).some(function (a) { return a.me; })) toast('Bạn chưa đánh dấu vị trí của mình trong danh sách tác giả.');
      var dup = S.profile.pubs.some(function (p) { return p.id !== r.id && ((r.doi && p.doi && p.doi.toLowerCase() === r.doi.toLowerCase()) || (CV.norm(p.title) === CV.norm(r.title) && p.year === r.year)); });
      if (dup) toast('Lưu ý: công bố này có thể đã được nhập trước đó.');
      upsert('pubs', r);
    } });
}

/* ---------------------------------------------------------------- Xuất CV + xem trước */
function runsHtml(runs) { return runs.map(function (r) { var t = esc(r.t); if (r.b) t = '<b>' + t + '</b>'; if (r.i) t = '<i>' + t + '</i>'; return t; }).join(''); }
function cellHtml(c) { if (typeof c === 'string') return esc(c); return c.paras.map(function (p) { return '<div>' + (runsHtml(p) || '&nbsp;') + '</div>'; }).join(''); }
function modelToHtml(blocks) {
  var out = '', i = 0;
  while (i < blocks.length) {
    var b = blocks[i];
    if (b.t === 'p') {
      var sz = b.size ? ' font-size:' + (b.size * 1.3333).toFixed(1) + 'px;' : '';
      out += '<p' + (b.sec ? ' data-sec="' + b.sec + '"' : '') + ' style="' + (b.rule ? 'width:' + (b.rule * 100) + '%;margin-left:auto;margin-right:auto;border-bottom:1px solid #000;padding-bottom:2px;' : '') + 'text-align:' + b.align + ';margin-top:' + ((b.before || 0) * 1.33) + 'px;margin-bottom:' + ((b.after == null ? 3 : b.after) * 1.33) + 'px;' + sz + '">' + (runsHtml(b.runs) || '&nbsp;') + '</p>'; i++;
    } else if (b.t === 'row') {
      var prev = b.leadW || 0, n = b.items.length;
      out += '<div class="rw" style="margin-bottom:' + ((b.after == null ? 3 : b.after) * 1.33) + 'px">' + (b.leadW ? '<span class="it" style="flex:0 0 ' + (b.leadW * 100) + '%"><span class="tx">' + (b.lead ? '<b>' + esc(b.lead) + '</b>' : '&nbsp;') + '</span></span>' : '') + b.items.map(function (it, k) {
        var end = k < n - 1 ? (b.stops[k] || (k + 1) / n) : 1, w = Math.round((end - prev) * 1000) / 10; prev = end;
        return '<span class="it" style="flex:1 1 ' + w + '%"><span class="tx">' + esc(it.label + (it.plain ? ' ' : ': ')) + (it.value ? '<b>' + esc(it.value) + '</b>' : '') + '</span>' + (it.value ? '<span class="gap"></span>' : '<span class="dots"></span>') + '</span>';
      }).join('') + '</div>'; i++;
    } else if (b.t === 'table') {
      out += '<table class="cvt"' + (b.sec ? ' data-sec="' + b.sec + '"' : '') + '><colgroup>' + b.widths.map(function (w) { return '<col style="width:' + w + '%">'; }).join('') + '</colgroup><tr>' + b.head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr>' +
        b.rows.map(function (r) { return '<tr>' + r.map(function (c, ci) { return '<td' + (b.center && b.center.indexOf(ci) >= 0 ? ' style="text-align:center"' : '') + '>' + cellHtml(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>'; i++;
    } else if (b.t === 'sign') {
      out += '<table class="sign" data-sec="sign"><tr><td>' + cellHtml(b.left) + '</td><td>' + cellHtml(b.right) + '</td></tr></table>'; i++;
    } else i++;
  }
  return out;
}

function renderPreview() {
  var el = $('#pvPage'); if (!el) return;

document.addEventListener('change', function (e) {
  var t = e.target, p = t.getAttribute && t.getAttribute('data-cfg');
  if (p) { setPath(S.exportCfg, p, t.checked); renderPreview(); return; }
  var sp = t.getAttribute && t.getAttribute('data-cfgsel');
  if (sp) {
    if (sp === 'template') { var old = S.exportCfg; S.exportCfg = CV.defaultConfig(t.value); S.exportCfg.place = old.place; S.exportCfg.date = old.date; render(); } else { setPath(S.exportCfg, sp, t.value); renderPreview(); }
  }
});
document.addEventListener('input', function (e) { var k = e.target.getAttribute && e.target.getAttribute('data-cfgtxt'); if (k) { S.exportCfg[k] = e.target.value; renderPreview(); } if (e.target.id === 'expName') S.exportName = e.target.value; });
ACT.pv_zoom = function (d) { S.zoom = Math.max(0.4, Math.min(2, +(S.zoom + parseFloat(d)).toFixed(2))); renderPreview(); };

ACT.pv_full = function () { S.full = !S.full; var w = $('#pvWrap'); w.classList.toggle('full', S.full); setTimeout(ACT.pv_fit, 30); };

document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.full && !$('#modalRoot').children.length) ACT.pv_full(); });
function doExport(fmt) {
  var btns = [$('#btnDocx'), $('#btnPdf')].filter(Boolean), labels = btns.map(function (b) { return b.textContent; });
  btns.forEach(function (b) { b.disabled = true; }); (fmt === 'pdf' ? $('#btnPdf') : $('#btnDocx')).textContent = 'Đang tạo file…';
  function done() { btns.forEach(function (b, i) { b.disabled = false; b.textContent = labels[i]; }); }
  (S.dirty || S.firstRun ? saveProfile() : Promise.resolve(true)).then(function (ok) {
    if (!ok) { done(); return; }
    return rpc('apiExport', S.exportCfg, fmt, S.exportName || '').then(function (r) { downloadB64(r.base64, r.fileName, r.mime); S.exports = r.exports; toast('Đã xuất ' + r.fileName + ' và lưu vào Lịch sử xuất hồ sơ.'); done(); });
  }).catch(function (e) { done(); toast(e.message, true); });
}
