<script>
/* =====================  CORE: trạng thái, RPC, khung, modal  ===================== */
var S = { token: '', user: null, profile: null, updatedAt: '', consent: {}, catalogs: {}, exports: [], route: 'basic', dirty: false, firstRun: false,
  trainTab: 'deg', exportCfg: null, zoom: 1, full: false, adm: { sel: {}, results: null }, saving: false };
var PAGES = {};   // route -> function render(root)
var ACT = {};     // hành động gắn qua data-act

function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

function rpc(name) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    function fail(msg, code) { var e = new Error(msg || 'Lỗi không xác định'); e.code = code; if ((code === 'NOAUTH' || code === 'BLOCKED') && S.user) sessionExpired(msg); rej(e); }
    google.script.run
      .withSuccessHandler(function (r) { if (r && r.ok) res(r.data); else fail(r && r.error, r && r.code); })
      .withFailureHandler(function (e) { fail((e && e.message) || String(e)); })
      .apiCall(S.token || '', name, args);
  });
}
function sessionExpired(msg) { S.user = null; S.token = ''; S.dirty = false; lsSet('llkh_tok', ''); showLogin(msg || 'Phiên đăng nhập đã hết hạn.'); }
function toast(msg, isErr) {
  var el = document.createElement('div'); el.className = 'toast' + (isErr ? ' err' : ''); el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(function () { el.remove(); }, isErr ? 6500 : 3200);
}
function getPath(o, p) { return p.split('.').reduce(function (a, k) { return a == null ? a : a[k]; }, o); }
function setPath(o, p, v) { var ks = p.split('.'), last = ks.pop(), t = ks.reduce(function (a, k) { return a[k]; }, o); t[last] = v; }
function uid() { return CV.uid(); }
function catalog(n) { return (S.catalogs && S.catalogs[n]) || []; }
function fmtDT(iso) { if (!iso) return ''; var d = new Date(iso); if (isNaN(d)) return iso; return d.toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' }); }

/* ---------- Kiểm tra định dạng ---------- */
var VAL = {
  date: function (v) { return CV.chk.date(v); },
  year: function (v) { return CV.chk.year(v); },
  monthyear: function (v) { return CV.chk.monthYear(v); },
  email: function (v) { return CV.chk.email(v); },
  phone: function (v) { return CV.chk.phone(v); },
  addr: function (v) { return CV.chk.addr(v, window.VN_GEO).msg; },
  doi: function (v) { return CV.chk.doi(v); },
  issn: function (v) { return CV.chk.issn(v); },
  isbn: function (v) { return CV.chk.isbn(v); },
  url: function (v) { return CV.chk.url(v); },
  orcid: function (v) { return CV.chk.orcid(v); }
};

/* ---------- Dựng trường nhập có ràng buộc dữ liệu ---------- */
function fld(label, path, o) {
  o = o || {}; var val = o.val != null ? o.val : getPath(S.profile, path); if (val == null) val = '';
  var id = 'f_' + path.replace(/\./g, '_'), inner;
  var attrs = 'id="' + id + '" data-bind="' + path + '"' + (o.v ? ' data-v="' + o.v + '"' : '') + (o.ro ? ' readonly' : '') + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + (o.list ? ' data-combo="' + o.list + '" autocomplete="off"' : '') + (o.seg ? ' data-combo-seg="1"' : '') + (o.max ? ' maxlength="' + o.max + '"' : '');
  if (o.v === 'date') attrs += ' data-mask="date" inputmode="numeric" maxlength="10"';
  if (o.v === 'phone') attrs += ' data-mask="phone" inputmode="numeric" maxlength="10"';
  if (o.t === 'select') inner = '<select ' + attrs + '><option value=""></option>' + (o.opts || []).map(function (x) { var ov = x.v != null ? x.v : x, ol = x.l != null ? x.l : x; return '<option value="' + esc(ov) + '"' + (ov === val ? ' selected' : '') + '>' + esc(ol) + '</option>'; }).join('') + '</select>';
  else if (o.t === 'area') inner = '<textarea rows="' + (o.rows || 3) + '" ' + attrs + '>' + esc(val) + '</textarea>';
  else if (o.t === 'check') return '<div class="f ' + (o.cls || '') + '"><label class="chk"><input type="checkbox" data-bind="' + path + '"' + (val ? ' checked' : '') + '><span>' + label + (o.hint ? '<br><span class="muted small">' + o.hint + '</span>' : '') + '</span></label></div>';
  else inner = '<input type="text" ' + attrs + ' value="' + esc(val) + '">';
  if (o.v === 'date' && !o.t) {
  var today = new Date().toISOString().slice(0, 10);
  inner = '<div class="datewrap">' + inner +
    '<span class="datebtn" title="Chọn từ lịch"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>' +
    '<input type="date" class="dp" tabindex="-1" aria-label="Chọn ngày từ lịch" max="' + today + '"></span></div>';
}
  var style = o.w ? ' style="--w:' + o.w + '"' : '';
  var body = inner + '<div class="err"></div>' + (o.hint ? '<div class="hint">' + o.hint + '</div>' : '');
  if (o.inl) return '<div class="f ' + (o.cls || '') + '"' + style + '><label for="' + id + '">' + esc(label) + (o.req ? ' <span class="req">*</span>' : '') + '</label><div class="fw">' + body + '</div></div>';
  return '<div class="f ' + (o.cls || '') + '"' + style + '><label for="' + id + '">' + esc(label) + (o.req ? ' <span class="req">*</span>' : '') + '</label>' + body + '</div>';
}
function irow() { return '<div class="irow">' + Array.prototype.join.call(arguments, '') + '</div>'; }
function datalists() { return ''; }

/* ---------- Combobox: gợi ý theo từng ký tự + danh sách A–Z ---------- */
var COMBO = {
  schools: { src: function () { return catalog('schools'); }, alpha: 1 }, majors: { src: function () { return catalog('majors'); }, alpha: 1 },
  countries: { src: function () { return catalog('countries'); }, alpha: 1 }, ethnicities: { src: function () { return catalog('ethnicities'); }, alpha: 1 },
  languages: { src: function () { return catalog('languages'); }, alpha: 1 }, systems: { src: function () { return catalog('systems'); }, alpha: 1 },
  provinces: { src: function () { return catalog('provinces'); }, alpha: 1 },
  degrees: { src: function () { return Object.keys(CV.DEG_RANK); }, alpha: 1 },
  titles: { src: function () { return ['Giáo sư', 'Phó giáo sư']; }, alpha: 1 },
  years: { src: function () { var y = new Date().getFullYear(), a = []; for (; y >= 1950; y--) a.push(String(y)); return a; } },
  geo: { find: function (q, qq) { return geoFind(q, qq); } },
  idplace: { src: function () { return [CV.CCCD_PLACE, 'Công an tỉnh/thành phố']; } }
};

/* ---------- Gợi ý địa chỉ: xã/phường + tỉnh/thành phố (đơn vị hành chính từ 01/07/2025) ---------- */
var GEO = null;
function geoIdx() {
  if (GEO) return GEO;
  var provs = [], wards = [], byName = {};
  (window.VN_GEO || []).forEach(function (g) {
    provs.push({ n: g[0], k: CV.norm(g[0]), core: CV.norm(g[0].replace(/^(Thành phố|Tỉnh)\s+/, '')) });
    g[1].forEach(function (w) { var core = w.replace(/^(Phường|Xã|Đặc khu)\s+/, ''); wards.push({ w: w, p: g[0], k: CV.norm(w), core: CV.norm(core) }); (byName[CV.norm(w)] = byName[CV.norm(w)] || []).push(g[0]); });
  });
  provs.sort(function (a, b) { return a.n.localeCompare(b.n, 'vi'); });
  GEO = { provs: provs, wards: wards, byName: byName };
  return GEO;
}
function geoRank(it, q) { // 0: tên bắt đầu bằng q, 1: một từ bắt đầu bằng q, 2: chứa q, -1: không khớp
  if (it.core.indexOf(q) === 0 || it.k.indexOf(q) === 0) return 0;
  if ((' ' + it.k).indexOf(' ' + q) >= 0) return 1;
  return it.k.indexOf(q) >= 0 ? 2 : -1;
}
function geoFind(q, qq) {
  var G = geoIdx(), segs = String(qq.prefix || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean), prev = segs.length ? CV.norm(segs[segs.length - 1]) : '';
  var only = prev && G.byName[prev];          // đoạn liền trước là một xã/phường đã biết: chỉ gợi ý tỉnh/thành phố chứa nó
  var provs = G.provs.filter(function (p) { return !only || only.indexOf(p.n) >= 0; });
  if (!q) return provs.map(function (p) { return p.n; });
  var out = [];
  [0, 1, 2].forEach(function (r) { provs.forEach(function (p) { if (geoRank(p, q) === r) out.push(p.n); }); });
  if (only) return out;
  [0, 1, 2].forEach(function (r) { G.wards.forEach(function (w) { if (out.length < 400 && geoRank(w, q) === r) out.push(w.w + ', ' + w.p); }); });
  return out;
}
var cb = { el: null, items: [], idx: -1, pop: null };
function cbPop() { if (!cb.pop) { cb.pop = document.createElement('div'); cb.pop.className = 'combo-pop'; cb.pop.hidden = true; document.body.appendChild(cb.pop); cb.pop.addEventListener('mousedown', function (e) { e.preventDefault(); var it = e.target.closest('.combo-i'); if (it) cbPick(+it.dataset.i); }); } return cb.pop; }
function cbHide() { if (cb.pop) cb.pop.hidden = true; cb.el = null; cb.idx = -1; }
function cbQuery(el) { var v = el.value; if (el.hasAttribute('data-combo-seg')) { var i = v.lastIndexOf(','); return { prefix: i >= 0 ? v.slice(0, i + 1) + ' ' : '', q: (i >= 0 ? v.slice(i + 1) : v).trim() }; } return { prefix: '', q: v.trim() }; }
function cbShow(el, all0) {
  var def = COMBO[el.getAttribute('data-combo')]; if (!def) return; cb.el = el; cb.t = Date.now();
  var qq = cbQuery(el), q = all0 ? '' : CV.norm(qq.q), list, all = def.find ? [] : def.src().slice();
  if (def.alpha) all.sort(function (a, b) { return a.localeCompare(b, 'vi'); });
  if (def.find) list = def.find(q, qq, el);
  else if (q) {
    var starts = [], inc = []; all.forEach(function (x) { var n = CV.norm(x); var i = n.indexOf(q); if (i === 0 || n.split(/[\s\-–,.()]+/).some(function (w) { return w.indexOf(q) === 0; })) starts.push(x); else if (i > 0) inc.push(x); });
    list = starts.concat(inc);
  } else list = all;
  var LIM = 120, total = list.length; list = list.slice(0, LIM); cb.items = list; cb.idx = list.length && q ? 0 : -1;
  var html = '', lastG = '';
  list.forEach(function (x, i) {
    if (!q && def.alpha && !def.find && all.length > 12) { var g = CV.norm(x).charAt(0).toUpperCase(); if (g !== lastG) { lastG = g; html += '<div class="combo-g">' + esc(g) + '</div>'; } }
    var label = esc(x); if (q) { var n = CV.norm(x), j = n.indexOf(q); if (j >= 0 && n.length === x.length) label = esc(x.slice(0, j)) + '<mark>' + esc(x.slice(j, j + q.length)) + '</mark>' + esc(x.slice(j + q.length)); }
    html += '<div class="combo-i' + (i === cb.idx ? ' on' : '') + '" data-i="' + i + '">' + label + '</div>';
  });
  if (!list.length) html = '<div class="combo-more">Không có gợi ý, bạn có thể gõ giá trị khác.</div>';
  else if (total > LIM) html += '<div class="combo-more">…còn ' + (total - LIM) + ' mục, gõ thêm để lọc.</div>';
  var pop = cbPop(), r = el.getBoundingClientRect(); pop.innerHTML = html; pop.hidden = false;
  pop.style.minWidth = Math.max(r.width, 200) + 'px'; pop.style.left = Math.min(r.left, window.innerWidth - 220) + 'px';
  var below = window.innerHeight - r.bottom; pop.style.maxHeight = Math.max(140, Math.min(280, below > 180 ? below - 12 : r.top - 12)) + 'px';
  if (below > 180) { pop.style.top = (r.bottom + 2) + 'px'; pop.style.bottom = 'auto'; } else { pop.style.bottom = (window.innerHeight - r.top + 2) + 'px'; pop.style.top = 'auto'; }
}
function cbPick(i) {
  var el = cb.el, v = cb.items[i]; if (!el || v == null) return;
  el.value = (cbQuery(el).prefix || '') + v; cbHide();
  el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true }));
  var w = el.closest('.f'); if (w) { w.classList.remove('invalid'); var er = w.querySelector('.err'); if (er) er.textContent = ''; }
}
function cbMove(d) { if (!cb.items.length) return; cb.idx = (cb.idx + d + cb.items.length) % cb.items.length; $$('.combo-i', cb.pop).forEach(function (n) { n.classList.toggle('on', +n.dataset.i === cb.idx); }); var on = $('.combo-i.on', cb.pop); if (on) on.scrollIntoView({ block: 'nearest' }); }
document.addEventListener('focusin', function (e) { if (e.target.getAttribute && e.target.getAttribute('data-combo') && !e.target.readOnly) cbShow(e.target, true); });
document.addEventListener('click', function (e) { var t = e.target; if (t.getAttribute && t.getAttribute('data-combo') && !t.readOnly && cb.el !== t) cbShow(t, true); else if (t.getAttribute && t.getAttribute('data-combo') && (!cb.pop || cb.pop.hidden)) cbShow(t, true); });
document.addEventListener('input', function (e) { if (e.target.getAttribute && e.target.getAttribute('data-combo') && !e.target.readOnly && e.isTrusted !== false) cbShow(e.target); });
document.addEventListener('focusout', function (e) { if (cb.el === e.target) cbHide(); });
document.addEventListener('keydown', function (e) {
  if (!cb.el || !cb.pop || cb.pop.hidden || e.target !== cb.el) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); e.stopImmediatePropagation(); if (cb.idx < 0) cb.idx = -1; cbMove(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); e.stopImmediatePropagation(); cbMove(-1); }
  else if (e.key === 'Enter' && cb.idx >= 0) { e.preventDefault(); e.stopImmediatePropagation(); cbPick(cb.idx); }
  else if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); cbHide(); }
  else if (e.key === 'Tab') cbHide();
}, true);
window.addEventListener('scroll', function (e) { if (cb.pop && !cb.pop.hidden && !cb.pop.contains(e.target) && Date.now() - (cb.t || 0) > 300) cbHide(); }, true);
window.addEventListener('resize', cbHide);

/* ---------- Trạng thái chưa lưu & bản nháp cục bộ ---------- */
function draftKey() { return 'llkh_draft_' + (S.user && S.user.email); }
function markDirty() {
  S.dirty = true; updateSaveBar();
  clearTimeout(markDirty.t);
  markDirty.t = setTimeout(function () { try { localStorage.setItem(draftKey(), JSON.stringify({ at: Date.now(), base: S.updatedAt, p: S.profile })); } catch (e) { } }, 600);
}
function clearDraft() { try { localStorage.removeItem(draftKey()); } catch (e) { } }
function updateSaveBar() {
  var el = $('#saveState'); if (!el) return;
  el.textContent = S.saving ? 'Đang lưu…' : (S.dirty ? 'Có thay đổi chưa lưu (đã lưu nháp trên máy này)' : (S.updatedAt ? 'Đã lưu lúc ' + fmtDT(S.updatedAt) : 'Chưa lưu'));
  el.className = 'st' + (S.dirty ? ' dirty' : '');
  var b = $('#saveBtn'); if (b) b.disabled = S.saving;
}
window.addEventListener('beforeunload', function (e) { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

/* Chuẩn hoá địa chỉ theo danh mục rồi kiểm tra định dạng; trả về danh sách lỗi (rỗng = được lưu). */
var ADDR_PATHS = ['basic.pob', 'basic.hometown', 'basic.address'];
function preSaveErrors() {
  var changed = false;
  ADDR_PATHS.forEach(function (p) { var v = getPath(S.profile, p), r = CV.chk.addr(v, window.VN_GEO); if (r.ok && r.canonical !== v) { setPath(S.profile, p, r.canonical); changed = true; } });
  if (changed && S.route === 'basic') render();
  return CV.formatErrors(S.profile, window.VN_GEO);
}
var ROUTE_NAME = { basic: 'Thông tin cơ bản', training: 'Quá trình đào tạo', work: 'Quá trình công tác', projects: 'Đề tài tham gia', pubs: 'Công bố khoa học', awards: 'Giải thưởng, sáng chế', extra: 'Thông tin bổ sung' };
function showFormatErrors(errs) {
  S.touched = true;
  var m = openModal('<header><h2>Chưa thể lưu hồ sơ</h2><button class="x" data-close aria-label="Đóng">×</button></header><div class="body"><p>Có ' + errs.length + ' dữ liệu chưa đúng định dạng. Hãy sửa rồi lưu lại.</p><ul class="errlist">' +
    errs.slice(0, 15).map(function (e) { return '<li><b>' + esc(e.label) + '</b> <span class="muted small">(' + esc(ROUTE_NAME[e.route] || '') + ')</span><br>' + esc(e.msg) + ' <button type="button" class="btn link" data-eg="' + e.route + '">Sửa ngay</button></li>'; }).join('') + (errs.length > 15 ? '<li class="muted">…và ' + (errs.length - 15) + ' mục khác.</li>' : '') + '</ul></div><footer><button class="btn primary" data-close>Đã hiểu</button></footer>', { wide: false });
  m.root.addEventListener('click', function (e) { var b = e.target.closest && e.target.closest('[data-eg]'); if (!b) return; m.close(); var r = b.getAttribute('data-eg'); if (S.route !== r) { S.route = r; } render(); window.scrollTo(0, 0); });
  if (S.route === 'basic') checkAllFields();
}
function checkAllFields() {
  $$('[data-v]').forEach(function (el) { var vt = el.getAttribute('data-v'), w = el.closest('.f'); if (!VAL[vt] || !w) return; var er = VAL[vt](el.value.trim()); w.classList.toggle('invalid', !!er); var d = $('.err', w); if (d) d.textContent = er; });
}
function saveProfile(force) {
  if (S.saving) return Promise.resolve(false);
  var errs = preSaveErrors();
  if (errs.length) { showFormatErrors(errs); return Promise.resolve(false); }
  S.touched = false;
  S.saving = true; updateSaveBar();
  return rpc('apiSaveProfile', S.profile, force ? '' : S.updatedAt).then(function (r) {
    if (r.conflict) {
      S.saving = false; updateSaveBar();
      return confirmBox('Hồ sơ đã được cập nhật ở nơi khác', 'Hồ sơ trên máy chủ mới hơn bản bạn đang sửa (có thể bạn đã sửa trên thiết bị khác). Bạn muốn ghi đè bằng bản đang sửa, hay tải bản mới từ máy chủ?', 'Ghi đè bằng bản của tôi', 'Tải bản mới (bỏ thay đổi)').then(function (ok) {
        if (ok === true) return saveProfile(true);
        if (ok === false) { S.profile = r.profile; S.profile.account = { email: S.user.email }; S.updatedAt = r.updatedAt; S.dirty = false; clearDraft(); render(); toast('Đã tải bản mới từ máy chủ.'); }
        return false;
      });
    }
    S.profile = r.profile; S.profile.account = { email: S.user.email }; S.updatedAt = r.updatedAt; S.dirty = false; S.saving = false; S.firstRun = false; clearDraft(); updateSaveBar();
    toast('Đã lưu hồ sơ.'); refreshCurrent(); return true;
  }).catch(function (e) { S.saving = false; updateSaveBar(); toast(e.message, true); return false; });
}
function refreshCurrent() { if (['export'].indexOf(S.route) >= 0) render(); }

/* ---------- Hộp thoại ---------- */
function openModal(html, o) {
  o = o || {};
  var root = document.createElement('div'); root.className = 'overlay';
  root.innerHTML = '<div class="modal' + (o.wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
  $('#modalRoot').appendChild(root);
  function close(v) { root.remove(); document.removeEventListener('keydown', onKey, true); if (o.onClose) o.onClose(v); }
  function onKey(e) {
    if (root !== $('#modalRoot').lastElementChild) return;
    if (e.key === 'Escape') { e.stopPropagation(); close(null); }
    else if (e.key === 'Enter' && o.onEnter && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON') { e.preventDefault(); o.onEnter(); }
  }
  document.addEventListener('keydown', onKey, true);
  root.addEventListener('mousedown', function (e) { if (e.target === root && o.backdropClose) close(null); });
  $$('[data-close]', root).forEach(function (b) { b.addEventListener('click', function () { close(null); }); });
  return { root: root, close: close };
}
function confirmBox(title, text, okLabel, altLabel) {
  return new Promise(function (res) {
    var m = openModal('<header><h2>' + esc(title) + '</h2></header><div class="body"><p>' + esc(text) + '</p></div><footer>' +
      '<button class="btn" data-close>Huỷ</button>' + (altLabel ? '<button class="btn" id="cbAlt">' + esc(altLabel) + '</button>' : '') +
      '<button class="btn primary" id="cbOk">' + esc(okLabel || 'Đồng ý') + '</button></footer>', { onClose: function (v) { res(v === undefined ? null : v); }, onEnter: function () { m.close(true); } });
    $('#cbOk', m.root).onclick = function () { m.close(true); };
    if (altLabel) $('#cbAlt', m.root).onclick = function () { m.close(false); };
    $('#cbOk', m.root).focus();
  });
}

/* ---------- Form modal theo lược đồ ---------- */
function openForm(spec) {
  var rec = JSON.parse(JSON.stringify(spec.rec || {})), orig = JSON.parse(JSON.stringify(rec));
  function fieldHtml(f) {
    var id = 'mf_' + f.k, v = rec[f.k] == null ? '' : rec[f.k], req = f.req ? ' <span class="req">*</span>' : '';
    var h = '<div class="f ' + (f.full === false ? '' : 'full') + '" data-fk="' + f.k + '"><label for="' + id + '">' + esc(f.label) + req + '</label>';

function maskDate(v, inserting) {

  var d = String(v).replace(/\D/g, '').slice(0, 8), out = d.slice(0, 2);
  if (d.length > 2) out += '/' + d.slice(2, 4);
  if (d.length > 4) out += '/' + d.slice(4, 8);
  if (inserting && (d.length === 2 || d.length === 4)) out += '/';       // gõ xong 2 số thì tự thêm "/"
  return out;
}
function maskMonthYear(v, inserting) {
  var m = /^\s*(\d{1,2})[\/.\-](\d{4})\s*$/.exec(v);                      // dán "5/2020" -> 05/2020
  if (m) return ('0' + m[1]).slice(-2) + '/' + m[2];
  var d = String(v).replace(/\D/g, '').slice(0, 6);
  if (inserting && d.length === 1 && +d > 1) return '0' + d + '/';        // gõ "3" -> "03/"

  if (inserting && d.length === 2) out += '/';                            // gõ đủ 2 số tháng thì tự thêm "/"

}

  var menu = (u.isAdmin ? grp('Quản trị', NAV_ADMIN.concat(u.isSys ? NAV_SYS : [])) : '') + grp('Hồ sơ khoa học', NAV_PROFILE) + grp('Quản lý hồ sơ', NAV_MANAGE);
  var roleName = u.isAdmin ? 'Quản trị' : 'Nhà khoa học';
  var acct = '<div class="acct"><b>Tài khoản</b><div class="em">' + esc(u.email) + '</div><div class="role">Vai trò: ' + roleName + '</div>' +
    (u.canAdmin ? '<button type="button" class="it" data-act="switch_role">' + ico('swap', 16) + '<span>' + (u.isAdmin ? 'Chuyển sang vai trò Nhà khoa học' : 'Chuyển sang vai trò Quản trị') + '</span></button>' : '') + '</div>' +
    '<button type="button" class="it out" data-act="logout">' + ico('logout') + '<span>Đăng xuất</span></button>';
  var cur = NAV_ADMIN.concat(NAV_SYS, NAV_USER).filter(function (n) { return n[0] === S.route; })[0];
  var root = (S.route.indexOf('a_') === 0 || S.route === 'sys') ? 'Quản trị' : 'Hồ sơ khoa học';
  app.innerHTML = '<div class="shell"><aside class="side" id="side"><div class="brand"><span class="logo">' + ico('grad', 22) + '</span><span>Hồ sơ Lý lịch khoa học</span></div>' +
    '<nav class="nav" aria-label="Điều hướng chính">' + menu + '</nav><div class="side-foot">' + nav(NAV_FOOT) + acct + '</div></aside><div class="scrim" data-act="menu_toggle"></div>' +
    '<div class="main"><header class="topbar"><button type="button" class="icon-btn menu-btn" data-act="menu_toggle" aria-label="Mở menu">' + ico('menu') + '</button>' +
    '<nav class="crumb" aria-label="Vị trí hiện tại"><span>' + root + '</span><span class="sep">›</span><b>' + esc(cur ? cur[1] : '') + '</b></nav><span class="spacer"></span>' +
    '<span class="role-pill">' + ico('grad', 16) + roleName + '</span></header><main class="content" id="view"></main></div></div>' +
    (showBar ? '<div class="savebar"><span class="st" id="saveState"></span><span class="spacer"></span><button class="btn primary" id="saveBtn" data-act="save">Lưu</button></div>' : '');
  var fn = PAGES[S.route] || PAGES.basic; fn($('#view'));
  if (S.touched && S.route === 'basic') checkAllFields();
  updateSaveBar();
}
ACT.go = function (r) {
  if (S.route === r) return;
  S.route = r; render(); window.scrollTo(0, 0);
};
ACT.menu_toggle = function () { var s = $('#side'); if (!s) return; s.classList.toggle('open'); var c = $('.scrim'); if (c) c.classList.toggle('on', s.classList.contains('open')); };
ACT.save = function () { saveProfile(); };
ACT.logout = function () {
  confirmBox('Đăng xuất', S.dirty ? 'Bạn còn thay đổi chưa lưu. Đăng xuất sẽ giữ bản nháp trên máy này.' : 'Đăng xuất khỏi ứng dụng?', 'Đăng xuất').then(function (ok) {
    if (!ok) return; S.dirty = false; S.user = null; S.token = ''; lsSet('llkh_tok', ''); S.route = 'basic'; S.profile = null;
    showLogin('', 'Bạn đã đăng xuất.');
  });
};
ACT.switch_role = function () {
  var to = S.user.isAdmin ? 'user' : 'admin';
  var go = function () { rpc('apiSwitchRole', to).then(function (d) { S.token = d.token; lsSet('llkh_tok', d.token); lsSet('llkh_role', to); S.dirty = false; return enterApp(); }).catch(function (e) { toast(e.message, true); }); };
  if (S.dirty) confirmBox('Chuyển vai trò', 'Bạn còn thay đổi chưa lưu. Chuyển vai trò sẽ giữ bản nháp trên máy này.', 'Chuyển').then(function (ok) { if (ok) go(); }); else go();
};
document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && $('#saveBtn')) { e.preventDefault(); saveProfile(); } });

function enterApp() {
  return rpc('apiBootstrap').then(function (d) {
    S.user = d.user; S.profile = d.profile; S.updatedAt = d.updatedAt; S.consent = d.consent || {}; S.catalogs = d.catalogs || {}; S.exports = d.exports || []; S.firstRun = d.firstRun;
    S.route = S.user.isAdmin ? 'a_search' : 'basic';
    var b = $('#boot'); if (b) b.remove(); hideLogin();
    // khôi phục bản nháp cục bộ nếu có
    try {
      var raw = localStorage.getItem(draftKey());
      if (raw) { var dr = JSON.parse(raw); if (dr && dr.p && dr.base === d.updatedAt && JSON.stringify(dr.p) !== JSON.stringify(d.profile)) { S.profile = dr.p; S.dirty = true; setTimeout(function () { toast('Đã khôi phục bản nháp chưa lưu trên máy này. Nhớ bấm "Lưu".'); }, 400); } }
    } catch (e) { }
    S.profile.account = { email: S.user.email };
    render();
    if (S.firstRun && !S.user.isAdmin) welcome();
  });
}
function boot() {
  var B = window.BOOT || {};
  if (B.token) { S.token = B.token; lsSet('llkh_tok', B.token); try { google.script.history.replace(null, {}, ''); } catch (e) { } if (B.note) setTimeout(function () { toast(B.note); }, 600); }
  else S.token = lsGet('llkh_tok');
  if (B.error) return showLogin(B.error);
  if (!S.token) return showLogin('', '');
  enterApp().catch(function (e) {
    if (e.code === 'NOAUTH' || e.code === 'BLOCKED') { S.token = ''; lsSet('llkh_tok', ''); showLogin(e.message); return; }
    var bt = $('#boot'); if (bt) bt.innerHTML = '<div style="max-width:520px;padding:20px;text-align:center"><h2>Không thể mở ứng dụng</h2><p>' + esc(e.message) + '</p></div>';
  });
}
function welcome() {
  var m = openModal('<header><h2>Chào mừng bạn</h2></header><div class="body"><p>Hãy nhập hồ sơ <b>một lần</b> và xuất ra file Word đúng mẫu lý lịch khoa học (BM04/QT03/ĐT).</p><ul><li>Họ tên, học vị, học hàm… được suy ra tự động từ các mục bạn nhập.</li><li><b>Riêng tư theo mặc định:</b> quản trị chỉ thấy email tài khoản cho đến khi bạn tự chọn chia sẻ ở mục “Quyền riêng tư”.</li><li>Số CMND/CCCD được mã hoá khi lưu và không bao giờ hiển thị cho quản trị.</li><li>Nhập tay luôn dùng được; tự điền theo DOI chỉ là hỗ trợ.</li></ul></div><footer><button class="btn primary" data-close>Bắt đầu</button></footer>', {});
}
</script>
